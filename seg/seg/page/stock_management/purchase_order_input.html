<section class="scan-container">

    <div class="field-group order-group">

        <label class="field-label" for="purchase-order-input">
            Lieferantenbestellung
        </label>

        <div class="input-wrapper">

            <div
                id="purchase-order-input"
                class="link-field-container">
            </div>

            <button
                id="clear-purchase-order"
                class="clear-button"
                type="button">

                ✕

            </button>

        </div>

    </div>


    <div class="field-group supplier-group">

        <label class="field-label" for="supplier-input">
            Lieferant
        </label>

        <div class="input-wrapper">

            <div
                id="supplier-input"
                class="link-field-container">
            </div>

            <button
                id="clear-supplier"
                class="clear-button"
                type="button">

                ✕

            </button>

        </div>

    </div>


    <button
        id="purchase-order-ok-button"
        class="ok-button"
        type="button">

        <i class="fa fa-check"></i>

    </button>

</section>
