<section class="scan-container">

    <div class="field-group article-group">

        <label class="field-label" for="from-warehouse-input">
            Ausgangslager
        </label>

        <div class="input-wrapper">
            <input
                id="from-warehouse-input"
                class="text-input"
                type="text"
                autocomplete="off">

            <button id="clear-from-warehouse" class="clear-button" type="button">
                ✕
            </button>
        </div>

    </div>


    <div class="field-group article-group">

        <label class="field-label" for="to-warehouse-input">
            Eingangslager
        </label>

        <div class="input-wrapper">
            <input
                id="to-warehouse-input"
                class="text-input"
                type="text"
                autocomplete="off">

            <button id="clear-to-warehouse" class="clear-button" type="button">
                ✕
            </button>
        </div>

    </div>


    <div class="field-group article-group">

        <label class="field-label" for="transfer-article-input">
            Artikel
        </label>

        <div class="input-wrapper">
            <input
                id="transfer-article-input"
                class="text-input"
                type="text"
                autocomplete="off">

            <button id="clear-transfer-article" class="clear-button" type="button">
                ✕
            </button>
        </div>

    </div>


    <button id="transfer-ok-button" class="ok-button" type="button">
        <i class="fa fa-check"></i>
    </button>

</section>


<div id="transfer-message" class="scan-message"></div>
