<section class="scan-container">
    
    <div class="field-group order-group">

        <label class="field-label" for="transfer-article-input">
            Artikel
        </label>

        <div class="input-wrapper">

            <div
                id="transfer-article-input"
                class="link-field-container">
            </div>

            <button
                id="clear-transfer-article"
                class="clear-button"
                type="button">

                ✕

            </button>

        </div>

    </div>

    <div class="transfer-inputs">

        <!-- Ausgangslager -->
        <div class="transfer-field">

            <label class="field-label" for="from-warehouse-input">
                Ausgangslager
            </label>

            <div class="input-wrapper">

                <div
                    id="from-warehouse-input"
                    class="link-field-container">
                </div>

                <button
                    id="clear-from-warehouse"
                    class="clear-button"
                    type="button">

                    ✕

                </button>

            </div>

        </div>


        <!-- Eingangslager -->
        <div class="transfer-field">

            <label class="field-label" for="to-warehouse-input">
                Zielplatz
            </label>

            <div class="input-wrapper">

                <div
                    id="to-warehouse-input"
                    class="link-field-container">
                </div>

                <button
                    id="clear-to-warehouse"
                    class="clear-button"
                    type="button">

                    ✕

                </button>

            </div>

        </div>


        <!-- Menge -->
        <div class="transfer-field">

            <label class="field-label" for="transfer-quantity-input">
                Menge
            </label>

            <div class="quantity-row">

                <div class="quantity-selector">

                    <button
                        id="transfer-qty-minus"
                        class="qty-button"
                        type="button">
                        −
                    </button>

                    <input
                        id="transfer-quantity-input"
                        class="quantity-input"
                        type="number"
                        value="1"
                        min="1">

                    <button
                        id="transfer-qty-plus"
                        class="qty-button"
                        type="button">
                        +
                    </button>

                </div>

            </div>

        </div>

    </div>


    <button
        id="transfer-ok-button"
        class="ok-button"
        type="button">

        <i class="fa fa-check"></i>

    </button>

</section>


<div id="transfer-message" class="scan-message"></div>
