<section class="list-content">

    <table class="item-table">

        {% for pickings_list in pickings_lists %}

            <tr class="order-row" data-order="{{ pickings_list.name }}">

                <td class="order-details">

                    <div class="order-title">
                        {{ pickings_list.name }}
                    </div>

                    <div class="order-supplier">
                        {{ pickings_list.customer_name }}
                    </div>

                </td>

                <td class="order-dates">

                    <div class="order-date">
                        <span class="order-date-label">Geplant</span><br>
                        {{ pickings_list.formatted_schedule_date }}
                    </div>

                    <div class="order-date">
                        <span class="order-date-label">Auftrag</span><br>
                        {{ pickings_list.sales_order }}
                    </div>

                </td>

            </tr>

        {% endfor %}

    </table>

</section>
