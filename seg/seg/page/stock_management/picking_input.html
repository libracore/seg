<section class="scan-container">

    <div class="field-group order-group">

        <label class="field-label" for="picking-list-input">
            Rüstschein
        </label>

        <div class="input-wrapper">

            <div
                id="picking-list-input"
                class="link-field-container">
            </div>

            <button
                id="clear-picking-list"
                class="clear-button"
                type="button">

                ✕

            </button>

        </div>

    </div>


    <div class="field-group supplier-group">

        <label class="field-label" for="customer-input">
            Kunde
        </label>

        <div class="input-wrapper">

            <div
                id="customer-input"
                class="link-field-container">
            </div>

            <button
                id="clear-customer"
                class="clear-button"
                type="button">

                ✕

            </button>

        </div>

    </div>


    <button
        id="picking-list-ok-button"
        class="ok-button"
        type="button">

        <i class="fa fa-check"></i>

    </button>

</section>

<div id="picking-message" class="scan-message"></div>
