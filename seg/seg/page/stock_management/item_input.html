<section class="scan-container">

    <div class="field-group article-group">
        <label class="field-label" for="article-input">Artikel Barcode</label>

        <div class="input-wrapper">
            <input
                id="article-input"
                class="text-input"
                type="text"
                autocomplete="off">

            <button id="clear-article" class="clear-button" type="button">
                ✕
            </button>
        </div>
    </div>

    <div class="field-group quantity-group">

        <label class="field-label" for="quantity-input">Menge</label>

        <div class="quantity-row">

            <div class="quantity-selector">

                <button id="qty-minus" class="qty-button" type="button">
                    −
                </button>

                <input
                    id="quantity-input"
                    class="quantity-input"
                    type="number"
                    value="1"
                    min="1">

                <button id="qty-plus" class="qty-button" type="button">
                    +
                </button>

            </div>

            <div id="input-extra-container">

            </div>

        </div>

    </div>

    <button id="ok-button" class="ok-button" type="button">
        <i class="fa fa-check"></i>
    </button>

</section>
